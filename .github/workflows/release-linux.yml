name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit or tag to package; empty uses the selected branch'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  identity:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Releases come only from main. A manual dispatch builds any ref and publishes nothing.
      - name: Require the tagged commit on main
        if: github.event_name == 'push'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "I release only commits that main already holds; promote them to main before tagging." >&2
            exit 1
          fi
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: python3 scripts/release_version.py --github-output "$GITHUB_OUTPUT"

  linux:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt_host: linux
            qt_arch: linux_gcc_64
            qt_dir: gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            qt_dir: gcc_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      QT_VERSION: '6.11.2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Validate release identity
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/release_version.py --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      # I use Python's corrected ZIP detection for Qt's ARM64 7z archives.
      # https://github.com/miurahr/aqtinstall/issues/1042
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install build and deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev nasm \
            libasound2-dev libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libssl-dev bubblewrap libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 \
            libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 \
            patchelf file binutils dbus-daemon desktop-file-utils zsync python3-venv \
            ripgrep hunspell rpm rpm2cpio cpio
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt "${{ matrix.qt_host }}" desktop "$QT_VERSION" "${{ matrix.qt_arch }}" \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt_dir }}/bin" >> "$GITHUB_PATH"
          {
            echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt_dir }}"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt_dir }}/lib"
            echo "QMAKE=$RUNNER_TEMP/Qt/$QT_VERSION/${{ matrix.qt_dir }}/bin/qmake"
            echo "GH_CONFIG_DIR=$RUNNER_TEMP/chilpa-gh"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.96.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/dictionaries
          key: lint-dictionaries-${{ hashFiles('tools/lint/dictionaries.lock.json') }}
      - name: Fetch the language lint dictionaries
        run: |
          python3 scripts/fetch-lint-dictionaries.py "$RUNNER_TEMP/dictionaries"
          echo "DICPATH=$RUNNER_TEMP/dictionaries" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-rust196-qt6112-${{ hashFiles('Cargo.lock') }}
      - name: Check the repository and update worker
        run: |
          tools/lint/fast
          python3 -m unittest discover -s scripts/tests
          cargo test --locked -q -p chilpa-library --lib
          cargo test --locked -q -p chilpa-core --lib
          cargo test --locked -q -p chilpa-api --lib
      - name: Build Linux binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release -p chilpa-qt
          scripts/check-qml-startup.sh "$GITHUB_WORKSPACE/target/release/chilpa-qt"
          tools/lint/footprint --binary "$GITHUB_WORKSPACE/target/release/chilpa-qt"
          python3 scripts/check-analysis-inventory.py target/release/chilpa-qt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Fetch verified packaging tools
        run: python3 scripts/fetch-release-tools.py "$RUNNER_TEMP/release-tools"
      - name: Package Linux tarball, DEB, RPM and AppImage
        run: |
          python3 scripts/package-linux.py \
            --binary target/release/chilpa-qt --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --tools "$RUNNER_TEMP/release-tools" --arch "${{ matrix.arch }}" \
            --output dist --glibc-max 2.39
      - name: Smoke the AppImage in an isolated profile
        run: |
          env -u LD_LIBRARY_PATH -u QT_PLUGIN_PATH -u QML_IMPORT_PATH -u QML2_IMPORT_PATH \
            APPIMAGE_EXTRACT_AND_RUN=1 scripts/check-qml-startup.sh "$GITHUB_WORKSPACE/dist/Chilpa-$RELEASE_VERSION-${{ matrix.arch }}.AppImage"
          cd dist
          sha256sum --check "SHA256SUMS-linux-${{ matrix.arch }}"
      - name: Check native package payloads
        run: |
          python3 scripts/check-linux-packages.py --dist dist --version "$RELEASE_VERSION" --arch "${{ matrix.arch }}"
      - name: Check installation and updates with the packaged AppImage
        run: |
          python3 scripts/check-installer.py --package "dist/Chilpa-$RELEASE_VERSION-${{ matrix.arch }}.AppImage" \
            --version "$RELEASE_VERSION" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chilpa-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      QT_VERSION: '6.11.2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Validate release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: python3 scripts/release_version.py --github-env "$GITHUB_ENV"
      - name: Install macOS build and deployment dependencies
        run: |
          brew install pkg-config cmake
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
          xcrun --find actool
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.96.0'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: desktop-${{ runner.os }}-${{ runner.arch }}-rust196-qt6112-${{ hashFiles('Cargo.lock') }}
      - name: Check release tooling and the macOS engine
        run: |
          python3 -m unittest discover -s scripts/tests
          cargo test --locked -q -p chilpa-bwrap --lib
          cargo test --locked -q -p chilpa-core --lib
          cargo test --locked -q -p chilpa-api --lib
      - name: Build macOS binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release -p chilpa-qt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Check both native icon appearances
        run: |
          icon_tool="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          for appearance in Default Dark; do
            "$icon_tool" packaging/macos/AppIcon.icon --export-image \
              --output-file "$RUNNER_TEMP/icon-$appearance.png" --platform macOS \
              --rendition "$appearance" --width 512 --height 512 --scale 1
            sips -s format bmp "$RUNNER_TEMP/icon-$appearance.png" \
              --out "$RUNNER_TEMP/icon-$appearance.bmp" >/dev/null
          done
          if cmp -s "$RUNNER_TEMP/icon-Default.bmp" "$RUNNER_TEMP/icon-Dark.bmp"; then
            echo 'The native light and dark icons rendered identically.' >&2
            exit 1
          fi
      - name: Package the app, light and dark icons, ZIP and DMG
        run: |
          python3 scripts/package-macos.py --binary target/release/chilpa-qt \
            --version "$RELEASE_VERSION" --output dist --arch "${{ matrix.arch }}" --require-native-icon
          python3 scripts/check-macos-package.py dist/Chilpa.app --report "$RUNNER_TEMP/macos-smoke.json"
          cd dist
          shasum -a 256 --check SHA256SUMS-macos-${{ matrix.arch }}
      - name: Check installation and updates with the packaged ZIP
        run: |
          python3 scripts/check-installer.py --package "dist/Chilpa-$RELEASE_VERSION-macos-${{ matrix.arch }}.zip" \
            --version "$RELEASE_VERSION" --arch "${{ matrix.arch }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chilpa-macos-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.dmg
            dist/MANIFEST-macos-${{ matrix.arch }}.json
            dist/SHA256SUMS-macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14


  assemble:
    needs: [identity, linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: chilpa-*
          path: downloaded
      - name: Verify the complete release and assemble checksums
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          RELEASE_COMMIT: ${{ needs.identity.outputs.commit }}
        run: python3 scripts/assemble-release.py --input downloaded --output dist --version "$RELEASE_VERSION" --commit "$RELEASE_COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: chilpa-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  draft:
    if: github.event_name == 'push'
    needs: [identity, assemble]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_PRERELEASE: ${{ needs.identity.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: chilpa-release
          path: dist
      - name: Create the draft release
        env:
          GH_CONFIG_DIR: ${{ runner.temp }}/chilpa-gh
        run: |
          flags=()
          if [[ "$RELEASE_PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --draft --verify-tag "${flags[@]}" \
            --title "Chilpa $RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
