name: Desktop release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Commit or tag to package; empty uses the selected branch'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      CARGO_BUILD_JOBS: '2'
      QT_VERSION: '6.11.2'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Validate release identity
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          python3 scripts/release_version.py --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
      - name: Install build and deployment dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev nasm \
            libasound2-dev libjack-jackd2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libssl-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxcb-shape0 \
            libxcb-randr0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 \
            patchelf file binutils dbus-daemon desktop-file-utils zsync python3-venv \
            ripgrep hunspell
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin" >> "$GITHUB_PATH"
          {
            echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64"
            echo "LD_LIBRARY_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/lib"
            echo "QMAKE=$RUNNER_TEMP/Qt/$QT_VERSION/gcc_64/bin/qmake"
            echo "GH_CONFIG_DIR=$RUNNER_TEMP/chilpa-gh"
          } >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.96.0'
      - name: Fetch the language lint dictionaries
        run: |
          python3 scripts/fetch-lint-dictionaries.py "$RUNNER_TEMP/dictionaries"
          echo "DICPATH=$RUNNER_TEMP/dictionaries" >> "$GITHUB_ENV"
      - name: Check the repository and update worker
        run: |
          tools/lint/fast
          python3 -m unittest discover -s scripts/tests
          cargo test --locked -q -p chilpa-library --lib
          cargo test --locked -q -p chilpa-core --lib
          cargo test --locked -q -p chilpa-api --lib
      - name: Build Linux binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release -p chilpa-qt
          scripts/check-qml-startup.sh "$GITHUB_WORKSPACE/target/release/chilpa-qt"
          tools/lint/footprint --binary "$GITHUB_WORKSPACE/target/release/chilpa-qt"
          python3 scripts/check-analysis-inventory.py target/release/chilpa-qt
      - name: Fetch verified packaging tools
        run: python3 scripts/fetch-release-tools.py "$RUNNER_TEMP/release-tools"
      - name: Package Linux tarball and AppImage
        run: |
          python3 scripts/package-linux.py \
            --binary target/release/chilpa-qt --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --tools "$RUNNER_TEMP/release-tools" \
            --output dist --glibc-max 2.39
      - name: Smoke the AppImage in an isolated profile
        run: |
          export APPIMAGE_EXTRACT_AND_RUN=1
          scripts/check-qml-startup.sh "$GITHUB_WORKSPACE/dist/Chilpa-$RELEASE_VERSION-x86_64.AppImage"
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chilpa-linux-x86_64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  macos:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      QT_VERSION: '6.11.2'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
          persist-credentials: false
      - name: Validate release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: python3 scripts/release_version.py --github-env "$GITHUB_ENV"
      - name: Install macOS build and deployment dependencies
        run: |
          brew install pkg-config cmake
          python3 -m venv "$RUNNER_TEMP/qt-installer"
          "$RUNNER_TEMP/qt-installer/bin/python" -m pip install aqtinstall==3.3.0
          "$RUNNER_TEMP/qt-installer/bin/python" -m aqt install-qt mac desktop "$QT_VERSION" clang_64 \
            --outputdir "$RUNNER_TEMP/Qt"
          echo "$RUNNER_TEMP/Qt/$QT_VERSION/macos/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
          xcrun --find actool
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.96.0'
      - name: Check release tooling and the macOS engine
        run: |
          python3 -m unittest discover -s scripts/tests
          cargo test --locked -q -p chilpa-bwrap --lib
          cargo test --locked -q -p chilpa-core --lib
          cargo test --locked -q -p chilpa-api --lib
      - name: Build macOS binary
        run: |
          export RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME/.cargo=/cargo"
          cargo build --locked --release -p chilpa-qt
      - name: Check both native icon appearances
        run: |
          icon_tool="$(dirname "$(xcode-select -p)")/Applications/Icon Composer.app/Contents/Executables/ictool"
          for appearance in Default Dark; do
            "$icon_tool" packaging/macos/AppIcon.icon --export-image \
              --output-file "$RUNNER_TEMP/icon-$appearance.png" --platform macOS \
              --rendition "$appearance" --width 512 --height 512 --scale 1
            sips -s format bmp "$RUNNER_TEMP/icon-$appearance.png" \
              --out "$RUNNER_TEMP/icon-$appearance.bmp" >/dev/null
          done
          if cmp -s "$RUNNER_TEMP/icon-Default.bmp" "$RUNNER_TEMP/icon-Dark.bmp"; then
            echo 'The native light and dark icons rendered identically.' >&2
            exit 1
          fi
      - name: Package the app, light and dark icons, ZIP and DMG
        run: |
          python3 scripts/package-macos.py --binary target/release/chilpa-qt \
            --version "$RELEASE_VERSION" --output dist --require-native-icon
          python3 scripts/check-macos-package.py dist/Chilpa.app --report "$RUNNER_TEMP/macos-smoke.json"
          cd dist
          shasum -a 256 --check SHA256SUMS-macos-aarch64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chilpa-macos-aarch64
          path: |
            dist/*.zip
            dist/*.dmg
            dist/MANIFEST-macos-aarch64.json
            dist/SHA256SUMS-macos-aarch64
          if-no-files-found: error
          retention-days: 14
