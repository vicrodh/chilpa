[package]
name = "chilpa-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Where Chilpa's files go, per platform (ADR-010 M3).
chilpa-dirs.workspace = true
chilpa-models.workspace = true
chilpa-audio.workspace = true
chilpa-decode.workspace = true
chilpa-stream.workspace = true
chilpa-tags.workspace = true
chilpa-library.workspace = true
chilpa-analysis.workspace = true
# What a device refused, and why a track stopped, are read by the user.
chilpa-i18n.workspace = true
rusqlite = "0.40"
# Loudness as BS.1770 measures it, for normalization (QBZ uses the same).
ebur128 = "0.1"
chilpa-dsd.workspace = true
chilpa-sacd.workspace = true
roxmltree = "0.21"
tempfile = "3"

[dev-dependencies]
symphonia = { version = "0.5", features = ["all"] }

[target.'cfg(target_os = "linux")'.dependencies.chilpa-cd]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
chilpa-alsa.workspace = true
chilpa-pipewire.workspace = true
chilpa-pulse.workspace = true
chilpa-jack.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
chilpa-coreaudio.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
chilpa-wasapi.workspace = true
