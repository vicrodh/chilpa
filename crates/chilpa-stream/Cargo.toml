[package]
name = "chilpa-stream"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Why a stream could not be opened is read by the user.
chilpa-i18n.workspace = true
symphonia = { version = "0.5", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Ya venía en el árbol por ureq; aquí se usa para las peticiones que Chilpa
# hace por cuenta de un plugin, que entran y salen en JSON.
serde_json = "1"
