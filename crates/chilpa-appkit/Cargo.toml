[package]
name = "chilpa-appkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]

# The Dock's reopen event is registered from Objective-C; built only for a Mac.
[build-dependencies]
cc = "1"

# The generation the file dialog already brings, so the binary holds one.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSData", "NSString", "NSObject"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSResponder",
    "NSWindow",
    "NSButton",
    "NSControl",
    "NSView",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSStatusBar",
    "NSStatusItem",
    "NSStatusBarButton",
    "NSRunningApplication",
    "objc2-core-foundation",
] }
