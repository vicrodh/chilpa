[package]
name = "chilpa-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# The page the browser lands on is read by the user, and so is why an
# account did not connect.
chilpa-i18n.workspace = true
# The PKCE challenge is a SHA-256 in base64url.
sha2 = "0.10"
base64 = "0.22"
# The verifier and the state are random.
rand = "0.10"
serde = { version = "1", features = ["derive"] }
# The service's answers come as JSON.
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Only the tests reach a real network: the crate does not know one.
chilpa-stream.workspace = true
serde_json = "1"
