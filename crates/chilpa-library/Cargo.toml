[package]
name = "chilpa-library"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Where the library file goes, per platform (ADR-010 M3).
chilpa-dirs.workspace = true
# Why a library could not be opened is read by the user.
chilpa-i18n.workspace = true
chilpa-models.workspace = true
chilpa-tags.workspace = true
rusqlite = "0.40"
# A sidecar is JSON, read and written by hand so a key this version does not
# know is kept as it came.
serde_json = "1"

[dev-dependencies]
tempfile = "3"
