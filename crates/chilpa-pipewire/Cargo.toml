[package]
name = "chilpa-pipewire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# What a stack cannot promise is read by the user.
chilpa-i18n.workspace = true
chilpa-audio.workspace = true
# PCM keeps using the ALSA plugin; native DSD owns a PipeWire stream.
chilpa-alsa.workspace = true
# The HiFi Wizard reads the graph out of `pw-dump`.
serde_json = "1"

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3"
