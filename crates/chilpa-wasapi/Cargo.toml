[package]
name = "chilpa-wasapi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# What a stack cannot promise is read by the user.
chilpa-i18n.workspace = true
chilpa-audio.workspace = true

# The typed COM bindings and not the flat ones (`windows-sys`), which carry
# no COM interfaces at all. The alternative was writing seven vtables by
# hand against a machine that is not switched on, where one wrong slot is a
# call into whatever happens to be there.
[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
]
