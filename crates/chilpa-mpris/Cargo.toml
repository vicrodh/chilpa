[package]
name = "chilpa-mpris"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# The MPRIS interfaces, with the DesktopEntry property the shell needs.
mpris-server = "0.10"
# The same bus library mpris-server rides, for the instance name and logind.
# Never its tokio feature: every bus connection here runs on async-io.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
async-channel = "2"
pollster = "0.4"
