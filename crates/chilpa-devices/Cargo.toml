[package]
name = "chilpa-devices"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "chilpa-sync"
path = "src/main.rs"

[dependencies]
chilpa-sync.workspace = true
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
mtp-rs = "=0.34.1"
futures = "0.3"
bytes = "1"

[target.'cfg(target_os = "android")'.dependencies]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dev-dependencies]
mtp-rs = { version = "=0.34.1", features = ["virtual-device"] }
