[package]
name = "chilpa-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chilpa-core.workspace = true
chilpa-models.workspace = true
chilpa-library.workspace = true
chilpa-tags.workspace = true
chilpa-lyrics.workspace = true
chilpa-plugin.workspace = true
chilpa-secrets.workspace = true
chilpa-auth.workspace = true
chilpa-i18n.workspace = true
# Approvals are kept as JSON, readable by hand on purpose.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The test plugins are written in wasm text, so no separate toolchain is
# needed.
wat = "1"
# For putting an ISRC on a scanned track, which is what lets the search
# match what is local with what a source gives. It is the same rusqlite
# chilpa-library already uses.
chilpa-library.workspace = true
rusqlite = "0.40"
