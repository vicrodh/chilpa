[package]
name = "chilpa-cast"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chilpa-i18n.workspace = true
ureq = { version = "3", default-features = false }
roxmltree = "0.21"
http = "1"
serde = { version = "1", features = ["derive"] }

native-tls = "0.2"
mdns-sd = "0.21"
serde_json = "1"
getrandom = "0.4"
# DLNA control as the reference player does it: rupnp on a private
# current-thread runtime, so no thread outlives a call.
rupnp = { version = "3", features = ["full_device_spec"] }
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "net"] }
tempfile = "3"

[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
tiny_http = "0.12"
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_os = "linux")'.dependencies]
# native-tls uses the system OpenSSL here.
[target.'cfg(target_os = "windows")'.dependencies]
# native-tls uses Schannel here.
[target.'cfg(target_os = "macos")'.dependencies]
# native-tls uses Security Framework here.
