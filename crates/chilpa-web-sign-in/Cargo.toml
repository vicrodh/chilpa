[package]
name = "chilpa-web-sign-in"
description = "A window that opens a plugin's sign-in page and stops at its return address"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "chilpa-web-sign-in"
path = "src/main.rs"

[features]
# The window itself, on Qt WebEngine. Off by default: building the workspace
# needs no web engine, and a build without it answers that it is unavailable.
webengine = ["dep:cc", "dep:pkg-config"]

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
# The engine's processes end with the window when Chilpa ends (src/parent.rs).
libc = "0.2"

[build-dependencies]
cc = { version = "1", optional = true }
# Qt is found through pkg-config, which also reads a Flatpak's /app prefix.
pkg-config = { version = "0.3", optional = true }
