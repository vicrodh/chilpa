    "crates/chilpa-dirs",
    "crates/chilpa-audio",
    "crates/chilpa-tags",
    "crates/chilpa-lyrics",
    "crates/chilpa-analysis",
    "crates/chilpa-plugin",
    "crates/chilpa-bwrap",
    "crates/chilpa-secrets",
    "crates/chilpa-auth",
    "crates/chilpa-meta",
    "crates/chilpa-servers",
    "crates/chilpa-cast",
    "crates/chilpa-i18n",
    "crates/chilpa-library",
    "crates/chilpa-stream",
    "crates/chilpa-decode",
    "crates/chilpa-dsd",
    "crates/chilpa-sacd",
    "crates/chilpa-cd",
    "crates/chilpa-alsa",
    "crates/chilpa-mpris",
    "crates/chilpa-pipewire",
    "crates/chilpa-pulse",
    "crates/chilpa-jack",
    "crates/chilpa-coreaudio",
    "crates/chilpa-appkit",
    "crates/chilpa-wasapi",
    "crates/chilpa-core",
    "crates/chilpa-api",
    "crates/chilpa-qt-kit",
    "crates/chilpa-qt-sources",
    "crates/chilpa-qt-controls",
    "crates/chilpa-qt-folders",
    "crates/chilpa-qt-gallery",
    "crates/chilpa-qt-lyrics",
    "crates/chilpa-qt-metadata",
    "crates/chilpa-qt",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
chilpa-models = { path = "crates/chilpa-models" }
chilpa-dirs = { path = "crates/chilpa-dirs" }
chilpa-audio = { path = "crates/chilpa-audio" }
chilpa-tags = { path = "crates/chilpa-tags" }
chilpa-lyrics = { path = "crates/chilpa-lyrics" }
chilpa-analysis = { path = "crates/chilpa-analysis" }
chilpa-plugin = { path = "crates/chilpa-plugin" }
chilpa-bwrap = { path = "crates/chilpa-bwrap" }
chilpa-secrets = { path = "crates/chilpa-secrets" }
chilpa-auth = { path = "crates/chilpa-auth" }
chilpa-meta = { path = "crates/chilpa-meta" }
chilpa-cast = { path = "crates/chilpa-cast" }
chilpa-servers = { path = "crates/chilpa-servers" }
chilpa-i18n = { path = "crates/chilpa-i18n" }
chilpa-library = { path = "crates/chilpa-library" }
chilpa-stream = { path = "crates/chilpa-stream" }
chilpa-decode = { path = "crates/chilpa-decode" }
chilpa-dsd = { path = "crates/chilpa-dsd" }
chilpa-sacd = { path = "crates/chilpa-sacd" }
chilpa-cd = { path = "crates/chilpa-cd" }
chilpa-alsa = { path = "crates/chilpa-alsa" }
chilpa-mpris = { path = "crates/chilpa-mpris" }
chilpa-pipewire = { path = "crates/chilpa-pipewire" }
chilpa-pulse = { path = "crates/chilpa-pulse" }
chilpa-jack = { path = "crates/chilpa-jack" }
chilpa-coreaudio = { path = "crates/chilpa-coreaudio" }
chilpa-appkit = { path = "crates/chilpa-appkit" }
chilpa-wasapi = { path = "crates/chilpa-wasapi" }
chilpa-core = { path = "crates/chilpa-core" }
chilpa-api = { path = "crates/chilpa-api" }
chilpa-qt-kit = { path = "crates/chilpa-qt-kit" }
chilpa-qt-sources = { path = "crates/chilpa-qt-sources" }
chilpa-qt-controls = { path = "crates/chilpa-qt-controls" }
chilpa-qt-folders = { path = "crates/chilpa-qt-folders" }
chilpa-qt-gallery = { path = "crates/chilpa-qt-gallery" }
chilpa-qt-lyrics = { path = "crates/chilpa-qt-lyrics" }
chilpa-qt-metadata = { path = "crates/chilpa-qt-metadata" }
# The messages Chilpa and a plugin exchange. They live in the sdk branch of the
# plugins repository so a plugin builds without this source. It is pinned to
# a tag of that branch, one per change to the protocol, and the lockfile
# holds the commit the tag named when it was taken.
chilpa-plugin-api = { git = "ssh://forgejo/blitzkriegfc/chilpa-plugins.git", tag = "protocol-4" }
