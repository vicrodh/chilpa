# The CPAN distributions the compatibility worker loads (compat/perl), built
# with the Perl of perl.yml. They are installed in a staging folder that
# scripts/package-compat.sh copies to /app/bin/compat-runtime/libraries, beside
# the worker's adapter. XS distributions are compiled here; nothing is fetched
# while building. The releases are the ones the host runtime has used since
# 2026-10-01, plus XML-Parser and HTTP-Cookies, which outside a Flatpak came
# from the system's Perl. Each sha256 matches metacpan's checksum_sha256.
name: perl-modules
buildsystem: simple
build-commands:
  - >-
    bash build-compat-runtime.sh /app/bin/perl /app/lib/chilpa-compat/libraries .
    Module-Build-0.4234
    Canary-Stability-2013
    common-sense-3.75
    Types-Serialiser-1.01
    JSON-XS-4.04
    JSON-XS-VersionOneAndTwo-0.31
    AnyEvent-7.17
    Try-Tiny-0.32
    Exporter-Tiny-1.006003
    List-MoreUtils-XS-0.430
    List-MoreUtils-0.430
    MIME-Base32-1.303
    URI-5.37
    Encode-Locale-1.05
    IO-HTML-1.004
    LWP-MediaTypes-6.05
    TimeDate-2.35
    HTTP-Date-6.08
    Clone-0.50
    HTTP-Message-7.04
    HTTP-Cookies-6.12
    HTML-Tagset-3.24
    HTML-Parser-3.86
    HTML-Tree-5.07
    AppConfig-1.71
    Template-Toolkit-3.106
    XML-Parser-2.47
    Async-Util-0.01
    Carp-Assert-0.22
    Class-Data-Inheritable-0.10
    Class-ISA-0.36
    Class-Virtual-0.08
    Data-URIEncode-0.11
    enum-1.12
    Exporter-Lite-0.09
    Text-Unidecode-1.30
    Tie-Cache-LRU-20150301
    Tie-Cache-LRU-Expires-0.55
    Tie-RegexpHash-0.17
    Test-Fatal-0.019
  # The adapter's own imports and the XS modules load from this tree alone,
  # found as the worker finds them, through PERL5LIB.
  - >-
    env PERL5LIB=/app/lib/chilpa-compat/libraries/lib/perl5 /app/bin/perl
    -MXML::Parser -MTemplate -MTemplate::Stash::XS -MHTML::TreeBuilder -MHTTP::Cookies
    -MHTTP::Request -MHTTP::Response -MHTTP::Headers -MURI -MJSON::XS -MAnyEvent -MList::MoreUtils
    -MClone -MTie::Cache::LRU -MTie::Cache::LRU::Expires -MDate::Parse -MTry::Tiny -e 1
cleanup:
  - /lib/chilpa-compat
