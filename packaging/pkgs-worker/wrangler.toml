name = "chilpa-pkgs"
main = "src/index.js"
compatibility_date = "2025-10-01"
account_id = "b3d0b0d1313d0be934b58ad4dbb617d4"
workers_dev = false

# A Workers Custom Domain: the deploy creates the DNS record itself.
routes = [{ pattern = "pkgs.chilpa.app", custom_domain = true }]

# The index files are generated at release time into ./public by
# scripts/packaging/build-pkgs-repo.sh. The Worker runs first so it can
# redirect package paths before the static lookup.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Counts of the Flatpak descriptor requests (src/index.js); the table is
# created by the first count.
[[d1_databases]]
binding = "STATS"
database_name = "chilpa-pkgs-stats"
database_id = "56fa21f1-8e9a-45da-9254-568d313bbf74"
